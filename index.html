<style>
/* Layout: app de liga — cabecera de jornada, contenido en tarjetas por rol, barra inferior en móvil / pestañas arriba en escritorio.
   Cada paleta es un "look" único (no sigue el tema del sistema): fija fondo y todos los colores. */
:root {
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px; --r-sm: 9px;
  /* Paleta: Clásico (negro y dorado) */
  --bg:#09090d; --surface:#15151c; --surface-2:#1c1c25; --line:rgba(255,255,255,.08);
  --ink:#f2f2f6; --muted:#9a9aae; --accent:#f5c842; --accent-ink:#1a1400; --gold:#f5c842;
  --win:#34d399; --draw:#f5c842; --loss:#f87171; --pay:#fb923c;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── Cabecera ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding-block:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.brand h1{font-size:21px;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.tabs-top{display:none;margin-left:auto;gap:4px}
.tabs-top a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.tabs-top a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.pill{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);margin-right:6px;vertical-align:1px}

/* ── Barra inferior ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600}
.nav a[aria-current="page"]{color:var(--accent)}
.nav svg,.tabs-top svg{width:22px;height:22px}
@media (min-width:860px){
  .nav{display:none} body{padding-block-end:40px}
  .tabs-top{display:flex} .pill{margin-left:12px}
}

/* ── Vistas ── */
.view{padding-block:22px 8px;display:grid;gap:18px}
.view[hidden]{display:none}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 0}
.card-h h3{font-size:20px;text-transform:uppercase}
.card-b{padding:12px 16px 16px}
.link{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}

/* Hero de jornada */
.hero{display:grid;gap:14px}
.hero-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero-title h2{font-size:clamp(40px,11vw,64px);text-transform:uppercase}
.hero-title h2 span{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spot{position:relative;overflow:hidden;padding:16px;display:grid;gap:10px;align-content:start}
.spot .eyebrow{display:flex;align-items:center;gap:6px}
.spot .who{display:flex;align-items:center;gap:10px;min-width:0}
.spot .who b{font-size:16px;line-height:1.2}
.spot .big{font-family:var(--font-display);font-size:46px;font-weight:800;line-height:.9}
.spot .big small{font-size:16px;color:var(--muted);margin-left:4px;font-family:var(--font-body);font-weight:600}
.spot.win .big{color:var(--gold)}
.spot.lose .big{color:var(--loss)}
.spot .note{font-size:12.5px;color:var(--muted)}

.grid-2{display:grid;gap:18px}
@media (min-width:860px){ .grid-2{grid-template-columns:1.25fr 1fr;align-items:start} }

/* Resultados: marcador a dos líneas, como en las apps de resultados */
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.m{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;display:grid;gap:4px;min-width:0}
.m-line{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-width:0;color:var(--muted);font-weight:500;font-size:14px}
.m-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-line b{font-family:var(--font-display);font-size:20px;font-weight:700;min-width:28px;text-align:right}
.m-line.w{color:var(--ink);font-weight:700}
.m-line.w b{color:var(--accent)}
.m .tag{text-align:left;margin:0 0 2px}
.m.fxm .m-line{color:var(--ink);font-weight:600}
.matches.wide{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.matches.wide .m{scroll-snap-align:start}
@media (min-width:860px){ .matches.wide{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible} }
.res{display:grid}
.res-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.res-row:first-child{border-top:0}
.side{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500;font-size:14px;color:var(--muted)}
.side.h{justify-content:flex-end;text-align:right}
.side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.w{color:var(--ink);font-weight:700}
.score{display:flex;gap:2px;font-family:var(--font-display);font-weight:700;font-size:19px}
.score b{min-width:34px;text-align:center;padding:2px 4px;border-radius:6px;background:var(--surface-2)}
.score b.w{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:2px;text-align:center}

/* Pagos */
.pay{display:grid;gap:2px}
.pay-row{display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0}
.pay-row .pos{font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:17px}
.pay-row .amt{font-family:var(--font-display);font-weight:700;font-size:19px}
.heat{display:block;width:100%;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.heat i{display:block;height:100%;background:var(--pay)}
.pay-row .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Crónica teaser */
.teaser h3{font-size:24px;line-height:1.05;text-transform:none;letter-spacing:0}
.teaser p{color:var(--muted);margin:10px 0 0;max-width:65ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.teaser h3{text-transform:uppercase}
.teaser p{-webkit-line-clamp:2}

/* Próxima */
.fx{display:grid;gap:8px}
.fx-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px;font-size:14px;font-weight:600}
.fx-row .vs{text-align:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}

/* Clasificación */
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.st th.l{text-align:left}
.st td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.st tr:last-child td{border-bottom:0}
.st .pos{font-family:var(--font-display);font-weight:700;font-size:18px;width:30px;position:relative}
.st tr.z8 .pos::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--win)}
.st .team{text-align:left}
.st .team div{display:flex;align-items:center;gap:9px;min-width:0}
.st .team b{font-weight:600;white-space:nowrap}
.st .pts{font-family:var(--font-display);font-weight:800;font-size:21px;color:var(--accent)}
.mv{font-size:12px;font-weight:700;width:34px;white-space:nowrap}
.mv.up{color:var(--win)} .mv.dn{color:var(--loss)} .mv.eq{color:var(--muted)}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:18px;height:18px;border-radius:5px;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;color:var(--bg)}
.form .W{background:var(--win)} .form .D{background:var(--draw)} .form .L{background:var(--loss)}
.hm{display:none}
@media (min-width:640px){ .hm{display:table-cell} }
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);padding:12px 16px 14px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Escudos */
.crests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.crest-card{padding:16px 12px 14px;display:grid;justify-items:center;gap:8px;text-align:center}
.crest-card b{font-size:14px;line-height:1.2}
.crest-card small{color:var(--muted);font-size:12px;line-height:1.35}
.intro{color:var(--muted);max-width:65ch;margin:0}
.crest{display:block;flex-shrink:0}
/* ── Enlaces a equipo ── */
a.tl{color:inherit;text-decoration:none}
a.tl:hover{text-decoration:underline;text-underline-offset:3px}
.h-page{font-size:clamp(36px,9vw,52px);text-transform:uppercase}
.intro a{color:var(--accent)}

/* ── Jornadas ── */
.jsel{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;min-width:0}
.jbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer}
.jbtn:disabled{opacity:.35;cursor:default}
.jstrip{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;padding:2px;scrollbar-width:none;min-width:0}
.jstrip::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.pend{color:var(--muted);border-style:dashed}
.chip.part{border-color:var(--draw)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.static{cursor:default;padding:3px 9px;font-size:12px}
.state{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--win)}
.state.pendiente{color:var(--muted)} .state.provisional{color:var(--draw)}
.warn{margin:12px 16px 0;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--draw);color:var(--draw);font-size:13px;font-weight:600}
.rank{display:grid}
.rk{display:grid;grid-template-columns:26px auto minmax(0,1fr) auto 62px;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.rk:first-child{border-top:0}
.rk .pos{font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:16px}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rk b{font-family:var(--font-display);font-size:18px}
.rk .eur{text-align:right;font-weight:700;font-size:13px;color:var(--pay)}
.rk.paid .pos{color:var(--pay)}

/* ── Crónica ── */
.article{padding:22px 20px;display:grid;gap:14px}
.article h2{font-size:clamp(28px,6.5vw,44px);text-transform:uppercase;line-height:1.02;max-width:22ch}
.article p{margin:0;font-size:16.5px;line-height:1.7;max-width:65ch;color:var(--ink);opacity:.9}
.article p strong{color:var(--accent)}
.archive{display:grid;gap:8px}
.arch summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 16px}
.arch summary::-webkit-details-marker{display:none}
.arch summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.arch[open] summary::after{transform:rotate(225deg)}
.arch .t{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.arch-b{padding:0 16px 16px;display:grid;gap:10px}
.arch-b p{margin:0;max-width:65ch;color:var(--muted)}

/* ── Pagos / Equipos: tarjetas de cifra ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tiles.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:860px){ .tiles.four{grid-template-columns:repeat(4,1fr)} }
.tile{padding:14px 16px;display:grid;gap:8px;align-content:start;text-decoration:none;color:inherit;min-width:0}
.tile b{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1}
.tile small{color:var(--muted);font-size:12.5px}
.tile .who{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tile .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.gold b{color:var(--gold)} .tile.good b{color:var(--win)} .tile.bad b{color:var(--loss)} .tile.pay b{color:var(--pay)}
a.tile:hover,a.team-card:hover{border-color:var(--accent)}
.bars{display:grid;gap:2px}
.bar-row{display:grid;grid-template-columns:26px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0}
.bar-row .pos{font-family:var(--font-display);font-weight:700;color:var(--muted)}
.bar-row .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .amt{font-family:var(--font-display);font-weight:700;font-size:18px;text-align:right}
.bar-row .amt small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:600}
table.hist{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.hist th,.hist td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.hist th{font-size:11px;color:var(--muted);font-weight:700}
.hist .l{text-align:left}
.hist .l div{display:flex;align-items:center;gap:7px;font-weight:600}
.hist .sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.hist .cell{display:inline-block;min-width:30px;padding:2px 5px;border-radius:5px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--pay) calc(var(--o)*70%),transparent)}
.hist .tot{font-weight:800;color:var(--pay)}

/* ── Equipos ── */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team-card{padding:14px;display:grid;gap:12px;text-decoration:none;color:inherit}
.tc-h{display:flex;align-items:center;gap:12px}
.tc-h b{display:block;font-size:15px;line-height:1.2}
.tc-h small{color:var(--muted);font-size:12.5px}
.tc-s{display:flex;align-items:end;justify-content:space-between;gap:12px}
.tc-s b{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--accent);line-height:1;display:block}
.team-head{display:flex;align-items:center;gap:16px;min-width:0}
.vde{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;color:var(--muted);font-size:13px}
.vde b{color:var(--ink);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:860px){ .kpis{grid-template-columns:repeat(6,1fr)} }
.kpi{padding:12px 14px;display:grid;gap:4px;align-content:start}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}
.kpi small{color:var(--muted);font-size:12px}
.kpi.gold b{color:var(--gold)} .kpi.good b{color:var(--win)} .kpi.bad b{color:var(--loss)} .kpi.pay b{color:var(--pay)}
.chart{display:block;width:100%;min-width:520px;height:auto;font-family:var(--font-body)}
.legend-inline{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:600}
.legend-inline .ln{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--accent)}
.legend-inline .ln.dash{border-top:1.5px dashed var(--muted);margin-left:8px}
.jj td.l div{display:flex;align-items:center;gap:7px}
.jj td,.jj th{font-size:13.5px}
.jj td.good{color:var(--win);font-weight:700} .jj td.bad{color:var(--loss);font-weight:700}
.crest-note{display:flex;gap:14px;align-items:center;padding:14px 16px}
.crest-note p{margin:4px 0 0;color:var(--muted)}
.res{display:inline-flex;align-items:center;gap:8px}
.tile .who span{white-space:normal;line-height:1.2}
/* ── Equipos: modelos ── */
/* Tabla */
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.cmp th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}

<script>
// ═════════════ Utilidades ═════════════
const fmtEur = n => n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const jorNum = l => parseInt((/^J(\d+)/.exec(l)||[])[1],10);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const played = rounds2627.filter(r=>!r.pending);
const lastR = played[played.length-1];
const nextR = rounds2627.find(r=>r.pending);

function standingsUpTo(n){ // n = nº de jornadas disputadas a contar
  const t = Object.fromEntries(TEAMS_2627.map(x=>[x,{name:x,pts:0,pg:0,pe:0,pp:0,jor:0,form:[]}]));
  played.slice(0,n).forEach(r=>r.matches.forEach(([h,hs,as,a])=>{
    const x=+hs,y=+as;
    t[h].jor+=x; t[a].jor+=y;
    if(x>y){t[h].pts+=3;t[h].pg++;t[a].pp++;t[h].form.push('W');t[a].form.push('L');}
    else if(x<y){t[a].pts+=3;t[a].pg++;t[h].pp++;t[a].form.push('W');t[h].form.push('L');}
    else{t[h].pts++;t[a].pts++;t[h].pe++;t[a].pe++;t[h].form.push('D');t[a].form.push('D');}
  }));
  return Object.values(t).sort((a,b)=>b.pts-a.pts||b.jor-a.jor);
}

// ═════════════ Escudos generados ═════════════
// shape: escudo | frances | redondo · pattern: liso | franjas | aros | mitades | cuarteles | banda | chevron
const CRESTS = {
  "Danilo Stars":      {ab:"DS",  c1:"#14213d", c2:"#fca311", shape:"escudo",  pat:"liso",     em:"stars",  why:"Azul noche y estrellas doradas: el nombre lo pedía."},
  "Sergchenko":        {ab:"SRG", c1:"#1d6fd8", c2:"#ffd23f", shape:"redondo", pat:"mitades",  em:"ball",   why:"Azul y amarillo de estepa, partido por la mitad."},
  "Celta de Viño":     {ab:"CV",  c1:"#8ecae6", c2:"#7a1f3d", shape:"escudo",  pat:"franjas",  em:"glass",  why:"Celeste de Celta y franjas color vino. Con copa."},
  "Se vende Cuenta":   {ab:"SVC", c1:"#d62828", c2:"#ffffff", shape:"frances", pat:"banda",    em:"minus1", why:"Rojo de cartel de «Se vende». Lleva el −1 bordado."},
  "AnceLuni":          {ab:"AL",  c1:"#f8f9fa", c2:"#5b2a86", shape:"escudo",  pat:"chevron",  em:"star",   why:"Blanco y morado, aire de banquillo con ceja levantada."},
  "Avaricius Jr.":     {ab:"AVJ", c1:"#1f7a4a", c2:"#e8b923", shape:"redondo", pat:"aros",     em:"euro",   why:"Verde billete y oro. El símbolo del euro no es casualidad."},
  "Josisi Mourinho":   {ab:"JM",  c1:"#111111", c2:"#1f4fa3", shape:"escudo",  pat:"cuarteles",em:"one",    why:"Negro y azul, sobrio. El «1» es por lo de Special One."},
  "Sors":              {ab:"S",   c1:"#4b5160", c2:"#13294b", shape:"escudo",  pat:"liso",     em:"shadow", why:"Gris sombra con un VZ en marca de agua. Ya sabéis quién lo diseñó."},
  "Raphontino":        {ab:"RPH", c1:"#5b21b6", c2:"#f2c14e", shape:"frances", pat:"liso",     em:"stars",  why:"Morado presidencial con ribete dorado."},
  "Kingsquare":        {ab:"KSQ", c1:"#1d3fbf", c2:"#f2c14e", shape:"escudo",  pat:"cuarteles",em:"crown",  why:"Azul real, cuarteles y corona. Rey de la plaza."},
  "CucuDaris":         {ab:"CD",  c1:"#f07c1b", c2:"#1b7f5c", shape:"redondo", pat:"banda",    em:"ball",   why:"Naranja y verde, banda cruzada."},
  "Castriano Ronaldo": {ab:"CR",  c1:"#c8102e", c2:"#046a38", shape:"escudo",  pat:"mitades",  em:"seven",  why:"Rojo y verde y un 7. Siuuu."},
  "Vicentine Zidane":  {ab:"VZ",  c1:"#13294b", c2:"#ffffff", shape:"escudo",  pat:"franjas",  em:"star",   why:"Azul marino y blanco, elegancia de calvo genial."},
  "Tano Amunt":        {ab:"TA",  c1:"#ffffff", c2:"#111111", c3:"#f58220", shape:"escudo", pat:"banda", em:"ball", why:"Blanco y negro con banda naranja. Amunt."},
  "Cardonistas":       {ab:"CRD", c1:"#7b3f9e", c2:"#3c8d2f", shape:"frances", pat:"chevron",  em:"thistle",why:"Morado y verde de cardo."},
  "Puro Llorente":     {ab:"PL",  c1:"#7b4a2a", c2:"#b22222", shape:"redondo", pat:"franjas",  em:"ball",   why:"Marrón habano y rojo. Un puro de equipo."},
};
// Para equipos nuevos: escudo determinista a partir del nombre
function autoCrest(name){
  let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))>>>0;
  const hues=[[210,45],[0,45],[140,40],[30,90],[270,45],[190,60]];
  const [hu,sat]=hues[h%hues.length];
  const ab=name.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'?';
  return {ab,c1:`hsl(${hu} ${sat}% 30%)`,c2:`hsl(${(hu+180)%360} 70% 60%)`,shape:['escudo','frances','redondo'][h%3],
    pat:['liso','franjas','aros','mitades','banda','chevron'][(h>>3)%6],em:'ball',why:'Generado automáticamente a partir del nombre.'};
}
const lum = c => { const m=/^#(..)(..)(..)$/.exec(c); if(!m) return .2; const f=v=>{v=parseInt(v,16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}; return .2126*f(m[1])+.7152*f(m[2])+.0722*f(m[3]); };

let crestSeq=0;
function crest(name,size=32){
  const c = CRESTS[name] || autoCrest(name);
  const id = 'cr'+(++crestSeq);
  const c3 = c.c3 || c.c2;
  const shapes = {
    escudo:  'M10 8H90V54C90 80 72 97 50 106C28 97 10 80 10 54Z',
    frances: 'M8 16L50 4L92 16V58C92 84 72 99 50 106C28 99 8 84 8 58Z',
    redondo: 'M50 6A49 49 0 1 1 49.99 6Z',
  };
  const P = shapes[c.shape];
  const pats = {
    liso: '',
    franjas: [14,38,62,86].map(x=>`<rect x="${x-6}" y="0" width="12" height="110" fill="${c.c2}"/>`).join(''),
    aros: [22,46,70,94].map(y=>`<rect x="0" y="${y-6}" width="100" height="12" fill="${c.c2}"/>`).join(''),
    mitades: `<rect x="50" y="0" width="50" height="110" fill="${c.c2}"/>`,
    cuarteles: `<rect x="50" y="0" width="50" height="55" fill="${c.c2}"/><rect x="0" y="55" width="50" height="55" fill="${c.c2}"/>`,
    banda: `<polygon points="0,30 0,58 100,98 100,70" fill="${c3}"/>`,
    chevron: `<polygon points="0,52 50,82 100,52 100,72 50,102 0,72" fill="${c.c2}"/>`,
  };
  // color del texto: el que más contraste tenga con el color dominante
  const txt = lum(c.c1) > .4 ? '#111111' : '#ffffff';
  const halo = txt==='#ffffff' ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.75)';
  const emc = c.em==='shadow' ? 'rgba(255,255,255,.18)' : (lum(c.c1)>.4 ? c.c2 : (c.c2==='#ffffff'?'#ffffff':c.c2));
  const star=(x,y,r)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="${emc}" stroke="${halo}" stroke-width="1.2"/>`;};
  const ems = {
    stars: star(34,24,7)+star(50,21,8.5)+star(66,24,7),
    star: star(50,23,9),
    crown: `<path d="M33 30L36 16L44 24L50 12L56 24L64 16L67 30Z" fill="${emc}" stroke="${halo}" stroke-width="1.2"/>`,
    ball: `<circle cx="50" cy="23" r="8" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M50 18.5l3.5 2.6-1.3 4.1h-4.4l-1.3-4.1z" fill="#111"/>`,
    glass: `<path d="M43 14h14c0 7-3 11-7 11s-7-4-7-11zM50 25v6M45 32h10" fill="none" stroke="${emc}" stroke-width="2.4" stroke-linecap="round"/><path d="M44 18h12c-.5 4-3 6.5-6 6.5s-5.5-2.5-6-6.5z" fill="${emc}"/>`,
    minus1: `<rect x="37" y="15" width="26" height="15" rx="4" fill="#111"/><text x="50" y="26.5" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="13" fill="#fff">−1</text>`,
    euro: `<text x="50" y="31" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="20" fill="${emc}" stroke="${halo}" stroke-width=".8">€</text>`,
    one: `<text x="50" y="32" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="22" fill="${c.c2}" stroke="#fff" stroke-width="1.2" paint-order="stroke">1</text>`,
    seven: `<text x="50" y="32" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="21" fill="#f2c14e" stroke="${halo}" stroke-width="1" paint-order="stroke">7</text>`,
    thistle: `<path d="M50 30v-6M44 22c0-6 3-9 6-9s6 3 6 9z" fill="${lum(c.c1)>.4?c.c1:'#e9d5ff'}" stroke="${halo}" stroke-width="1.2"/><path d="M42 26l8-3 8 3" stroke="#a7f3d0" stroke-width="2" fill="none"/>`,
    shadow: `<text x="50" y="72" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="58" fill="rgba(255,255,255,.12)">VZ</text>`,
  };
  const fs = c.ab.length>=3 ? 26 : c.ab.length===2 ? 32 : 40;
  return `<svg class="crest" width="${size}" height="${size*1.1}" viewBox="0 0 100 110" role="img" aria-label="Escudo de ${esc(name)}">
    <defs><clipPath id="${id}"><path d="${P}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect width="100" height="110" fill="${c.c1}"/>${pats[c.pat]||''}${c.em==='shadow'?ems.shadow:''}</g>
    ${c.em!=='shadow'?(ems[c.em]||''):''}
    <text x="50" y="${c.em==='shadow'?70:69}" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="${fs}" fill="${txt}" stroke="${halo}" stroke-width="3" paint-order="stroke" letter-spacing=".5">${c.ab}</text>
    <path d="${P}" fill="none" stroke="${c.c2==='#ffffff'&&lum(c.c1)>.4?'#111':c3}" stroke-width="5"/>
    <path d="${P}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
  </svg>`;
}

// ═════════════ Iconos ═════════════

// ═════════════ Datos derivados ═════════════
const slug = n => n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const BY_SLUG = Object.fromEntries(TEAMS_2627.map(t=>[slug(t),t]));
const teamLink = (n, inner) => `<a class="tl" href="#equipo-${slug(n)}">${inner ?? esc(n)}</a>`;
const payFor = pos => (PAY_RULES_2627.find(r=>r.pos===pos)||{}).amount || 0;
const officialPos = (team,j) => { const r=jornadasRanking2627.find(x=>x.j===j); return r ? r.ranking.indexOf(team)+1 : null; };
const ptsOf = (team,j) => { const h=jorStatsHistory.find(x=>x.j===j); return h ? h.data[team] : null; };
const leagueAvg = j => { const v=Object.values(jorStatsHistory.find(x=>x.j===j).data); return v.reduce((a,b)=>a+b,0)/v.length; };
const fmt1 = n => n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});

const PAID = Object.fromEntries(TEAMS_2627.map(t=>[t,{amt:0,times:0,byJ:{}}]));
jornadasRanking2627.forEach(({j,ranking})=>ranking.forEach((t,i)=>{const a=payFor(i+1); if(a){PAID[t].amt+=a;PAID[t].times++;PAID[t].byJ[j]=a;}}));

function teamStats(t){
  const js = jorStatsHistory.filter(h=>h.data[t]!==undefined).map(h=>h.j);
  const pts = js.map(j=>ptsOf(t,j));
  const pos = js.map(j=>officialPos(t,j));
  const max=Math.max(...pts), min=Math.min(...pts);
  return { js, pts, pos, media: pts.reduce((a,b)=>a+b,0)/pts.length, max, maxJ: js[pts.indexOf(max)], min, minJ: js[pts.indexOf(min)],
    posMedia: pos.reduce((a,b)=>a+b,0)/pos.length, top8: pos.filter(p=>p<=8).length, pago: pos.filter(p=>p>10).length };
}
const STATS = Object.fromEntries(TEAMS_2627.map(t=>[t,teamStats(t)]));

function payersBlock(j){
  const rk = jornadasRanking2627.find(r=>r.j===j).ranking;
  const maxAmt = Math.max(...PAY_RULES_2627.map(p=>p.amount));
  return rk.slice(10).map((t,i)=>({t,pos:11+i,amt:payFor(11+i)})).reverse().map(p=>
    `<div class="pay-row"><span class="pos num">${p.pos}º</span>${crest(p.t,22)}<div style="display:grid;gap:4px;min-width:0"><span class="nm">${teamLink(p.t)}</span><span class="heat"><i style="width:${p.amt/maxAmt*100}%"></i></span></div><span class="amt num">${fmtEur(p.amt)}</span></div>`).join('');
}

function sparkline(vals, w=120, h=30){
  const lo=Math.min(0,...vals), hi=Math.max(70,...vals), n=vals.length;
  const x=i=>n<2?w/2:(i/(n-1))*(w-4)+2, y=v=>h-2-((v-lo)/(hi-lo))*(h-4);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="2.8" fill="var(--accent)"/></svg>`;
}

function drawJornada(){
  const r = rounds2627[selJ], n = jorNum(r.j);
  document.querySelectorAll('#jstrip .chip').forEach(c=>c.setAttribute('aria-pressed', +c.dataset.i===selJ));
  const strip=document.getElementById('jstrip'), chip=document.getElementById('jchip-'+selJ);
  if(strip&&chip) strip.scrollLeft = chip.offsetLeft - strip.clientWidth/2 + chip.clientWidth/2;
  document.getElementById('jprev').disabled = selJ===0;
  document.getElementById('jnext').disabled = selJ===rounds2627.length-1;
  const vuelta = /\(Vuelta (J\d+)\)/.exec(r.j);
  const estado = r.pending ? 'Pendiente' : r.partialPending ? 'Provisional' : 'Disputada';
  const matches = r.matches.map(([h,hs,as,a])=>{
    const x=+hs,y=+as, p=r.pending||hs==='';
    return `<div class="m">${[[h,hs,!p&&x>y],[a,as,!p&&y>x]].map(([t,sc,w])=>`<div class="m-line ${w?'w':''}">${crest(t,22)}<span>${teamLink(t)}</span><b class="num">${p?'–':sc}</b></div>`).join('')}</div>`;}).join('');
  let rankHtml = '';
  if(!r.pending){
    const rk = jornadasRanking2627.find(x=>x.j===r.j).ranking;
    rankHtml = `<div class="card"><div class="card-h"><h3>Ranking de la jornada</h3><span class="eyebrow">Pagan del 11º al 16º</span></div>
      <div class="card-b rank">${rk.map((t,i)=>{const a=payFor(i+1);return `<div class="rk ${a?'paid':''}"><span class="pos num">${i+1}</span>${crest(t,20)}<span class="nm">${teamLink(t)}</span><b class="num">${ptsOf(t,r.j)}</b><span class="eur num">${a?fmtEur(a):''}</span></div>`;}).join('')}</div></div>`;
  }
  document.getElementById('jbody').innerHTML = `
    <div class="card">
      <div class="card-h"><h3>Jornada ${n}</h3><span class="state ${estado.toLowerCase()}">${estado}${vuelta?` · vuelta de la ${vuelta[1]}`:''}</span></div>
      ${r.partialPending?`<div class="warn">Queda ${r.pendingMatches||1} partido por disputar. Resultados y clasificación provisionales.</div>`:''}
      <div class="card-b matches">${matches}</div>
    </div>
    ${rankHtml || `<div class="card"><div class="card-b"><p class="intro">Esta jornada aún no se ha jugado. Los resultados, el ranking y los pagos aparecerán aquí en cuanto se dispute.</p></div></div>`}`;
}

let eqSort = {k:'pos',dir:1};
const OPT = new Set(['max','min','posMedia','top8']); // se ocultan en móvil

const sd = a => { const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length); };
const crestColors = t => CRESTS[t] || autoCrest(t);
function shade(hex, f){ const m=/^#(..)(..)(..)$/.exec(hex); if(!m) return hex; return '#'+[1,2,3].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(m[i],16)*f))).toString(16).padStart(2,'0')).join(''); }

  body.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{

// 2 · Tabla comparativa ordenable, con barras dentro de las celdas
function modelTabla(now,posOf){
  const rows = TEAMS_2627.map(t=>({name:t,pos:posOf[t],media:STATS[t].media,max:STATS[t].max,min:STATS[t].min,posMedia:STATS[t].posMedia,top8:STATS[t].top8,paid:PAID[t].amt}));
  const {k,dir}=eqSort; rows.sort((a,b)=> (typeof a[k]==='string'? a[k].localeCompare(b[k]) : a[k]-b[k]) * dir);
  const mx = key => Math.max(...rows.map(r=>r[key]));
  const cols = [['pos','#'],['name','Equipo'],['media','Media'],['max','Mejor'],['min','Peor'],['posMedia','Pos. media'],['top8','Top 8'],['paid','Pagado']];
  const cell=(r,key)=>{const val=r[key];
    if(key==='name') return `<td class="l sticky"><div>${crest(r.name,22)}${teamLink(r.name)}</div></td>`;
    if(key==='pos') return `<td class="pos">${val}</td>`;
    const txt = key==='media'||key==='posMedia' ? fmt1(val)+(key==='posMedia'?'º':'') : key==='paid' ? fmtEur(val) : val;
    const w = key==='posMedia' ? (17-val)/16 : key==='min' ? Math.max(0,val)/mx('max') : Math.max(0,val)/(mx(key)||1);
    const col = key==='paid'?'var(--pay)':key==='min'?'var(--loss)':key==='max'?'var(--win)':'var(--accent)';
    return `<td class="${OPT.has(key)?'opt':''}"><span class="barcell" style="--w:${(w*100).toFixed(0)}%;--c:${col}">${txt}</span></td>`;};
  return `<div class="tbl-wrap"><table class="cmp num">
    <thead><tr>${cols.map(([key,n])=>`<th data-k="${key}" class="c-${key} ${key==='name'?'l sticky':''} ${OPT.has(key)?'opt':''} ${eqSort.k===key?'on':''}">${n}${eqSort.k===key?(eqSort.dir<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr data-href="#equipo-${slug(r.name)}">${cols.map(([key])=>cell(r,key)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

// 4 · Premios: cada tarjeta cuenta una historia distinta
function modelPremios(now,posOf){
  const T = TEAMS_2627, S = STATS;
  const pick = (f, better) => T.reduce((b,t)=> better(f(t),f(b)) ? t : b);
  const last3 = t => { const p=S[t].pts.slice(-3); return p.reduce((a,b)=>a+b,0)/p.length; };
  const jump = t => { let best=-1e9,j=''; S[t].pts.forEach((v,i)=>{ if(i&&v-S[t].pts[i-1]>best){best=v-S[t].pts[i-1]; j=S[t].js[i];} }); return {d:best,j}; };
  const posNow = Object.fromEntries(now.map((x,i)=>[x.name,i+1]));
  const back = Math.max(1, played.length-3), posThen = Object.fromEntries(standingsUpTo(back).map((x,i)=>[x.name,i+1]));
  const drop = t => posNow[t]-posThen[t];
  const used = new Set();
  // pickU: el mejor según el criterio, sin repetir equipo ya premiado
  const pickU = (f, better) => { const t = T.filter(x=>!used.has(x)).reduce((b,x)=> better(f(x),f(b)) ? x : b); used.add(t); return t; };
  const fixed = {
    int: pickU(t=>S[t].posMedia,(a,b)=>a<b),
    mec: pickU(t=>PAID[t].amt,(a,b)=>a>b),
    rec: pickU(t=>S[t].min,(a,b)=>a<b),
  };
  const awards = [
    {k:'El Intocable', t:fixed.int, v:t=>fmt1(S[t].posMedia)+'º', s:'mejor puesto medio cada semana', cls:'gold'},
    {k:'En racha', t:pickU(last3,(a,b)=>a>b), v:t=>fmt1(last3(t)), s:'pts de media en las 3 últimas', cls:'good'},
    {k:'El Reloj Suizo', t:pickU(t=>sd(S[t].pts),(a,b)=>a<b), v:t=>'±'+fmt1(sd(S[t].pts)), s:'el más regular: siempre lo mismo', cls:''},
    {k:'Montaña Rusa', t:pickU(t=>sd(S[t].pts),(a,b)=>a>b), v:t=>'±'+fmt1(sd(S[t].pts)), s:'nunca sabes qué equipo va a salir', cls:''},
    {k:'El Resucitado', t:pickU(t=>jump(t).d,(a,b)=>a>b), v:t=>'+'+jump(t).d, s:t=>`puntos de subida de golpe en la ${jump(t).j}`, cls:'good'},
    {k:'En caída libre', t:pickU(drop,(a,b)=>a>b), v:t=>drop(t)>0?`▼${drop(t)}`:'=', s:t=>drop(t)>0?`puestos perdidos en la tabla desde la J${back}`:'nadie ha caído en las últimas jornadas', cls:'bad'},
    {k:'Mecenas de la liga', t:fixed.mec, v:t=>fmtEur(PAID[t].amt), s:t=>`pagados en ${PAID[t].times} jornadas. Gracias por tanto`, cls:'pay'},
    {k:'Récord negativo', t:fixed.rec, v:t=>S[t].min, s:t=>`puntos en la ${S[t].minJ}. Nadie lo olvidará`, cls:'bad'},
  ];
  return `<p class="intro">Los equipos según su historia de la temporada. Se recalcula solo cada jornada.</p>
  <div class="awards">${awards.map(a=>`<a class="card award ${a.cls}" href="#equipo-${slug(a.t)}">
    <span class="eyebrow">${a.k}</span>
    <div class="aw-main">${crest(a.t,54)}<div style="min-width:0"><b class="aw-team">${esc(a.t)}</b><span class="aw-v num">${a.v(a.t)}</span></div></div>
    <small>${typeof a.s==='function'?a.s(a.t):a.s}</small></a>`).join('')}</div>
`;
}

function chart(t){
  const narrow = matchMedia('(max-width: 639px)').matches;
  const s=STATS[t], avg=s.js.map(leagueAvg), W=narrow?340:640,H=narrow?190:230,L=28,R=10,T=12,B=24;
  const every = narrow && s.js.length>8 ? 2 : 1;
  const lo=Math.min(0,...s.pts)<0?Math.floor(Math.min(...s.pts)/10)*10:0, hi=Math.ceil(Math.max(70,...s.pts)/10)*10;
  const x=i=>L+(s.js.length<2?0:i*(W-L-R)/(s.js.length-1)), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const ticks=[]; for(let v=0; v<=hi; v+=20) ticks.push(v);
  const line=(vals)=>vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${x(0)},${y(Math.max(lo,0))} ${line(s.pts)} ${x(s.js.length-1)},${y(Math.max(lo,0))}`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Puntos de ${esc(t)} por jornada frente a la media de la liga">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="11">${v}</text>`).join('')}
    ${s.js.map((j,i)=>(s.js.length-1-i)%every?'':`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="11">${j}</text>`).join('')}
    <polygon points="${area}" fill="var(--accent)" opacity=".10"/>
    <polyline points="${line(avg)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polyline points="${line(s.pts)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${s.pts.map((v,i)=>{const p=s.pos[i];const c=p<=4?'var(--win)':p>10?'var(--loss)':'var(--accent)';return `<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.pts.length-1?5:3.5}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"><title>${s.js[i]}: ${v} pts (${p}º)</title></circle>`;}).join('')}
  </svg>`;
}

function renderEquipo(t){
  const s=STATS[t], now=standingsUpTo(played.length), p=now.findIndex(x=>x.name===t)+1, st=now[p-1];
  const rows = played.map(r=>{
    const m=r.matches.find(m=>m[0]===t||m[3]===t); if(!m) return '';
    const home=m[0]===t, mine=+(home?m[1]:m[2]), theirs=+(home?m[2]:m[1]), rival=home?m[3]:m[0];
    const res=mine>theirs?'W':mine<theirs?'L':'D', pos=officialPos(t,r.j), a=payFor(pos);
    return `<tr><td>${r.j}</td><td class="l"><div>${crest(rival,18)}${teamLink(rival)}</div></td><td><span class="res"><span class="form"><i class="${res}">${{W:'V',D:'E',L:'D'}[res]}</i></span>${mine}-${theirs}</span></td><td class="${pos<=4?'good':pos>10?'bad':''}">${pos}º</td><td class="c-pag">${a?fmtEur(a):''}</td></tr>`;}).reverse().join('');
  const kpi=(l,v,sub='',cls='')=>`<div class="card kpi ${cls}"><span class="eyebrow">${l}</span><b class="num">${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
  document.getElementById('v-equipo').innerHTML = `
  <a class="link" href="#equipos">← Todos los equipos</a>
  <div class="team-head">
    ${crest(t,92)}
    <div style="min-width:0">
      <div class="eyebrow">${p}º en la liga · ${st.pts} pts</div>
      <h2 class="h-page">${esc(t)}</h2>
      <div class="vde num"><span><b>${st.pg}</b> V</span><span><b>${st.pe}</b> E</span><span><b>${st.pp}</b> D</span><span class="form">${st.form.slice(-5).map(f=>`<i class="${f}">${{W:'V',D:'E',L:'D'}[f]}</i>`).join('')}</span></div>
    </div>
  </div>
  <div class="kpis">
    ${kpi('Media',fmt1(s.media),'pts por jornada','gold')}
    ${kpi('Mejor jornada',s.max,s.maxJ,'good')}
    ${kpi('Peor jornada',s.min,s.minJ,'bad')}
    ${kpi('Posición media',fmt1(s.posMedia)+'º','en el ranking semanal')}
    ${kpi('Jornadas top 8',s.top8,`de ${s.js.length}`)}
    ${kpi('Pagado',fmtEur(PAID[t].amt),`${PAID[t].times} ${PAID[t].times===1?'vez':'veces'} en zona de pago`,'pay')}
  </div>
  <div class="card"><div class="card-h"><h3>Puntos por jornada</h3><span class="eyebrow legend-inline"><i class="ln"></i>${esc(t)} <i class="ln dash"></i>Media liga</span></div><div class="card-b"><div class="tbl-wrap">${chart(t)}</div></div></div>
  <div class="card"><div class="card-h"><h3>Jornada a jornada</h3></div>
    <div class="card-b"><div class="tbl-wrap"><table class="st num jj"><thead><tr><th class="c-j">J</th><th class="l c-riv">Rival</th><th class="c-res">Resultado</th><th class="c-pue">Pos.</th><th class="c-pag">Pagó</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>
  <div class="card crest-note">${crest(t,56)}<div><span class="eyebrow">El escudo</span><p>${(CRESTS[t]||autoCrest(t)).why}</p></div></div>`;
}

});

function route(){
  let v = (location.hash||'#inicio').slice(1);
  if (v==='escudos') v='equipos';
  let cur = VIEWS.some(([id])=>id===v) ? v : 'inicio', active = cur;
  if (v.startsWith('equipo-') && BY_SLUG[v.slice(7)]) { renderEquipo(BY_SLUG[v.slice(7)]); cur='equipo'; active='equipos'; }
  ['inicio','clasificacion','jornadas','cronica','pagos','equipos','equipo'].forEach(id=>document.getElementById('v-'+id).hidden = id!==cur);
  document.querySelectorAll('[data-v]').forEach(a=>{ if(a.dataset.v===active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (cur==='jornadas') drawJornada();
}
