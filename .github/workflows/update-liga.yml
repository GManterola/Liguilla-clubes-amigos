name: 🏆 Actualizar Liga Clubes Amigos

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no modifica el HTML)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📊 Fetch jornada desde Biwenger
        run: |
          cd scripts
          BIWENGER_TOKEN="${{ secrets.BIWENGER_TOKEN }}" \
          BIWENGER_LEAGUE="${{ secrets.BIWENGER_LEAGUE }}" \
          BIWENGER_USER="${{ secrets.BIWENGER_USER }}" \
          node fetch-jornada.js

      - name: 🔍 Verificar si hay jornada nueva
        id: check
        run: |
          if [ -f "scripts/jornada-data.json" ]; then
            JORNADA=$(node -e "const d=require('./scripts/jornada-data.json'); console.log(d.jornada)")
            echo "jornada=$JORNADA" >> $GITHUB_OUTPUT
            echo "has_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Actualizar index.html
        if: steps.check.outputs.has_data == 'true'
        run: |
          cd scripts
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then DRY_FLAG="--dry-run"; fi
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} node update-site.js $DRY_FLAG

      - name: 📤 Commit y push
        if: steps.check.outputs.has_data == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Liga Bot 🤖"
          git config user.email "liga-bot@noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "ℹ️ Sin cambios"
          else
            git commit -m "⚽ Actualizar ${{ steps.check.outputs.jornada }} automáticamente"
            git push
            echo "✅ Publicado."
          fi
